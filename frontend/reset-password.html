<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Passwort setzen – TBC</title>
  <link rel="icon" href="/api/brand/logo" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px;max-width:420px;width:100%}
    h1{font-size:22px;font-weight:800;margin-bottom:6px}
    .sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:20px}
    .email-pill{display:inline-block;background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;margin-bottom:20px}
    label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:5px;margin-top:12px}
    input{width:100%;padding:11px 13px;font-size:14px;font-family:inherit;border:1.5px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.07);color:#fff;outline:none;transition:border-color .15s}
    input:focus{border-color:#1a3a8f;background:rgba(255,255,255,.1)}
    .btn{width:100%;padding:13px;font-size:15px;font-weight:700;font-family:inherit;background:#1a3a8f;color:#fff;border:none;border-radius:10px;cursor:pointer;margin-top:18px;transition:opacity .15s}
    .btn:hover:not(:disabled){opacity:.9}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .err{background:rgba(220,38,38,.15);color:#fca5a5;border:1px solid rgba(220,38,38,.3);border-radius:9px;padding:9px 13px;font-size:12px;margin-top:12px;display:none}
    .ok{background:rgba(22,163,74,.15);color:#86efac;border:1px solid rgba(22,163,74,.3);border-radius:9px;padding:9px 13px;font-size:12px;margin-top:12px;display:none}
    .center{text-align:center;margin-top:14px}
    .center a{color:rgba(255,255,255,.55);font-size:12px;text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Passwort setzen</h1>
    <p class="sub" id="subtitle">Lade…</p>
    <div class="email-pill" id="emailPill" style="display:none"></div>

    <form id="form" style="display:none">
      <label>Neues Passwort</label>
      <input id="pw" type="password" minlength="8" placeholder="mindestens 8 Zeichen" required autocomplete="new-password">
      <label>Passwort bestätigen</label>
      <input id="pw2" type="password" minlength="8" placeholder="nochmal eingeben" required autocomplete="new-password">
      <button class="btn" id="btn" type="submit">Passwort speichern</button>
    </form>

    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>
    <div class="center"><a href="/">← Zurück zur Anmeldung</a></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const errEl = document.getElementById('err');
    const okEl = document.getElementById('ok');
    const subEl = document.getElementById('subtitle');
    const titleEl = document.getElementById('title');
    const pillEl = document.getElementById('emailPill');
    const formEl = document.getElementById('form');

    function showErr(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }
    function showOk(msg) { okEl.textContent = msg; okEl.style.display = 'block'; }

    if (!token) {
      subEl.textContent = '';
      showErr('Kein Token in der URL gefunden.');
    } else {
      fetch('/api/auth/password-reset/verify?token=' + encodeURIComponent(token))
        .then(r => r.json().then(d => ({ ok: r.ok, d })))
        .then(({ ok, d }) => {
          if (!ok) { subEl.textContent = ''; showErr(d.error || 'Link ungültig'); return; }
          titleEl.textContent = d.isFirstTime ? 'Passwort vergeben (Erstanmeldung)' : 'Passwort zurücksetzen';
          subEl.textContent = d.isFirstTime
            ? 'Lege ein Passwort fest, um dein Konto zu aktivieren.'
            : 'Wähle ein neues Passwort für dein Konto.';
          pillEl.textContent = d.email;
          pillEl.style.display = 'inline-block';
          formEl.style.display = 'block';
        })
        .catch(() => { subEl.textContent = ''; showErr('Verifizierung fehlgeschlagen'); });
    }

    formEl.addEventListener('submit', async e => {
      e.preventDefault();
      errEl.style.display = 'none';
      okEl.style.display = 'none';
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw !== pw2) return showErr('Passwörter stimmen nicht überein.');
      if (pw.length < 8) return showErr('Mindestens 8 Zeichen.');

      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Speichere…';
      try {
        const res = await fetch('/api/auth/password-reset/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pw })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || 'Fehler beim Speichern');
        localStorage.setItem('tbc_token', d.token);
        localStorage.setItem('tbc_user', JSON.stringify(d.user));
        showOk('Passwort gesetzt — du wirst weitergeleitet…');
        setTimeout(() => location.href = '/app/dashboard', 800);
      } catch (err) {
        showErr(err.message);
        btn.disabled = false;
        btn.textContent = 'Passwort speichern';
      }
    });
  </script>
</body>
</html>
